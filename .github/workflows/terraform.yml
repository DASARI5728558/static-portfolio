name: Terraform Infra

# Auto-triggers ONLY when terraform files change — keeps this
# separate from the app deploy.yml workflow, which triggers on
# any push (app code changes shouldn't re-run infra).
on:
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - "!terraform/bootstrap/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - "!terraform/bootstrap/**"

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform

permissions:
  id-token: write      # needed for OIDC auth to AWS
  contents: read
  pull-requests: write  # so the plan can be posted as a PR comment

jobs:
  terraform:
    name: Terraform Plan/Apply
    runs-on: ubuntu-latest
    # Skip entirely for PRs from forks — forked PRs don't get repo secrets,
    # so role-to-assume would resolve empty and fail credential loading.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # On a PR: show the plan for review, don't apply.
      # `run:` steps don't auto-populate outputs.stdout — capture it manually.
      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -out=tfplan > plan_output.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          cat plan_output.txt
          exit 0
        continue-on-error: true

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const workDir = process.env.TF_WORKING_DIR;
            let planOutput = fs.readFileSync(path.join(workDir, 'plan_output.txt'), 'utf8');

            // GitHub comment bodies have a size limit — truncate long plans
            const maxLen = 60000;
            if (planOutput.length > maxLen) {
              planOutput = planOutput.slice(0, maxLen) + '\n\n... (truncated)';
            }

            const output = `#### Terraform Plan
            \`\`\`
            ${planOutput}
            \`\`\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail job if plan failed
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

      # Only apply automatically on a real push to main (not PRs)
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

      - name: Show outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform output
